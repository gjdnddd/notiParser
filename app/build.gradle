plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gjdnd.notiparser'
    compileSdk 34

    defaultConfig {
        applicationId "com.gjdnd.notiparser"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 디버그 서명 키를 OS 기본 경로(~/.android/debug.keystore) 대신 프로젝트 안의
    // 파일로 고정한다. 기본 경로는 컴퓨터마다 독립적으로 자동 생성되어 서로 달라서,
    // PC/노트북처럼 여러 기기에서 빌드하면 매번 서명이 달라져 기존 설치 위 업데이트가
    // "서명 불일치"로 실패하는 문제가 있었다. 이 파일은 OneDrive로 프로젝트와 함께
    // 동기화되므로 어느 기기에서 빌드하든 항상 같은 키로 서명된다.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 출력 APK 파일명에 버전+빌드일자+빌드타입을 넣는다 — 기본 "app-debug.apk"는
    // 어느 시점 빌드인지 파일명만 보고 알 수 없어서(과거 "재설치했는데 옛날 빌드였다"
    // 혼선의 원인 중 하나), PC/노트북 어디서 빌드하든 구분 가능하게 한다.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def date = new Date().format('yyyy-MM-dd')
            outputFileName = "notiParser_v${variant.versionName}_${date}_${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
